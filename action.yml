name: WeUp service check
description: Check website HTTPS and email-domain MX records on Ubuntu, with optional outage email alerts.
inputs:
  domain:
    description: Website domain to check. Optional if email is provided.
    required: false
  email:
    description: Email address whose domain's MX records are checked. Optional if domain is provided.
    required: false
  alert-to:
    description: Recipient for outage and recovery notifications. Leave empty to disable notifications.
    required: false
  smtp-host:
    description: SMTP server hostname.
    required: false
  smtp-port:
    description: SMTP over SSL port.
    required: false
    default: "465"
  smtp-username:
    description: SMTP username and sender address.
    required: false
  smtp-password:
    description: SMTP password or app password.
    required: false
runs:
  using: composite
  steps:
    - name: Validate targets
      shell: bash
      env:
        WEUP_DOMAIN: ${{ inputs.domain }}
        WEUP_EMAIL: ${{ inputs.email }}
      run: |
        if [[ -z "$WEUP_DOMAIN" && -z "$WEUP_EMAIL" ]]; then
          echo "::error::Provide at least one of the domain or email inputs."
          exit 2
        fi
    - uses: actions/setup-python@v5
      with:
        python-version: "3.x"
    - name: Install DNS tools
      shell: bash
      run: sudo apt-get update && sudo apt-get install --yes dnsutils
    - name: Restore outage state
      if: inputs.alert-to != ''
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/.weup-state
        key: weup-state-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: weup-state-
    - name: Run service checks
      shell: bash
      env:
        WEUP_DOMAIN: ${{ inputs.domain }}
        WEUP_EMAIL: ${{ inputs.email }}
        ALERT_TO: ${{ inputs.alert-to }}
        SMTP_HOST: ${{ inputs.smtp-host }}
        SMTP_PORT: ${{ inputs.smtp-port }}
        SMTP_USERNAME: ${{ inputs.smtp-username }}
        SMTP_PASSWORD: ${{ inputs.smtp-password }}
        WEUP_STATE_FILE: ${{ github.workspace }}/.weup-state/state.json
      run: |
        ARGS=()
        if [[ -n "$WEUP_DOMAIN" ]]; then
          ARGS+=(--domain "$WEUP_DOMAIN")
        fi
        if [[ -n "$WEUP_EMAIL" ]]; then
          ARGS+=(--email "$WEUP_EMAIL")
        fi
        if [[ -n "$ALERT_TO" ]]; then
          python3 "$GITHUB_ACTION_PATH/monitor.py" "${ARGS[@]}" --state-file "$WEUP_STATE_FILE"
        else
          python3 "$GITHUB_ACTION_PATH/weup.py" "${ARGS[@]}"
        fi
    - name: Save outage state
      if: always() && inputs.alert-to != ''
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}/.weup-state
        key: weup-state-${{ github.run_id }}-${{ github.run_attempt }}
